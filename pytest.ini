[pytest]
# The repo root is a Python package (Wan2GP plugin + __init__.py). Without an
# explicit testpaths, pytest tries to collect that __init__.py as a package and
# every test errors with "attempted relative import with no known parent
# package". Keeping the config at the root also means plain `pytest` works from
# anywhere in the tree. The default (prepend) import mode is required: with
# --import-mode=importlib pytest derives module names relative to this rootdir
# (tests.test_x) and re-triggers the same __init__.py import.
testpaths = tests
# --confcutdir=tests keeps pytest from walking the parents of the `tests` arg.
# This repo's root is itself a package (it has __init__.py, the Wan2GP plugin
# entry point). If pytest walks up to it, it creates a Package node for the root
# and imports __init__.py as a standalone module, which dies on `from . import
# expander` and errors out every test with "attempted relative import with no
# known parent package".
addopts = -q --confcutdir=tests
