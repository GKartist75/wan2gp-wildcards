[pytest]
# Config for running the suite from inside tests/ (e.g. `cd tests && pytest`).
# `pytest` from the repo root uses the pytest.ini one level up; that file needs
# --confcutdir=tests, which is resolved against the invocation directory and so
# cannot be shared. See the comment in ../pytest.ini for the gory details.
testpaths = .
addopts = -q
