name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu matters as much as Windows: the collection-wide test asserts
        # every wildcard path is lowercase, which is only actually enforced on a
        # case-sensitive filesystem. Wan2GP runs on Linux/Colab too.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # No Wan2GP install is needed: tests/conftest.py stubs gradio and the
      # shared.* host modules and exercises the real plugin modules.
      - name: Run test suite
        run: python -m pytest
